name: ProofGate Agent Security Gate

# Blocks a pull request that ships an over-permissioned AI agent.
# Points at the deliberately-vulnerable example by default so the gate visibly
# FAILS — set AGENT_CONFIG to your own agent config in real use.
on:
  pull_request:
    # Only gate PRs that actually change an agent config — so normal code/doc/test
    # PRs are never falsely blocked. Point this at wherever your agent configs live.
    paths:
      - "backend/examples/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to post the report as a PR comment

jobs:
  proofgate-gate:
    runs-on: ubuntu-latest
    env:
      AGENT_CONFIG: backend/examples/support_agent.yaml
      MAX_RISK: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ProofGate (gate dependencies)
        working-directory: backend
        run: pip install pyyaml pydantic

      - name: Scan agent & gate on risk
        id: gate
        continue-on-error: true   # don't stop the job; we post the report first
        working-directory: backend
        run: |
          python -m app.cli scan "../${AGENT_CONFIG}" \
            --max-risk "${MAX_RISK}" --md "${GITHUB_WORKSPACE}/proofgate-report.md"

      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${GITHUB_WORKSPACE}/proofgate-report.md"

      - name: Enforce gate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "ProofGate blocked this PR — see the comment above."
          exit 1
