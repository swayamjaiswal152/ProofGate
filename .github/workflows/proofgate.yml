
name: ProofGate CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  security-gate-self-test:
    name: Verify Vulnerable Agent Is Blocked
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify gate rejects the vulnerable example
        working-directory: backend
        shell: bash
        run: |
          set +e
          output=$(python -m app.cli scan examples/support_agent.yaml --max-risk 30 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 1 ] && \
             printf '%s\n' "$output" | grep -q "GATE FAILED"; then
            echo "PASS: ProofGate correctly blocked the vulnerable agent."
          else
            echo "FAIL: ProofGate did not reject the vulnerable agent as expected."
            exit 1
          fi

