
name: ProofGate CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  security-gate:
    name: ProofGate Security Gate
    runs-on: ubuntu-latest
    env:
      AGENT_CONFIG: backend/examples/support_agent.yaml
      MAX_RISK: "30"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ProofGate
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan agent and generate report
        id: gate
        continue-on-error: true
        working-directory: backend
        run: |
          python -m app.cli scan "../${AGENT_CONFIG}" \
            --max-risk "${MAX_RISK}" \
            --md "${GITHUB_WORKSPACE}/proofgate-report.md"

      - name: Post report as PR comment
        if: always() && github.event_name == 'pull_request' && steps.gate.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${GITHUB_WORKSPACE}/proofgate-report.md" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file "${GITHUB_WORKSPACE}/proofgate-report.md"
          else
            echo "No report was generated."
          fi

      - name: Enforce gate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "ProofGate blocked this PR — see the report comment."
          exit 1
